<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SXB ULTRA MAX</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --primary: #53fc18;
            --btn-bg: rgba(30, 30, 30, 0.9);
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: var(--text-color); height: 100vh; width: 100vw; display: flex; flex-direction: column; }

        /* الشريط العلوي */
        .top-bar { 
            display: flex; align-items: center; justify-content: flex-start; gap: 8px; 
            padding: 12px 15px; flex-wrap: wrap; background: rgba(11, 14, 20, 0.95); 
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 20; 
        }
        
        .logo { font-size: 16px; font-weight: 900; color: var(--primary); letter-spacing: 1px; margin-left: auto; text-shadow: 0 0 10px rgba(83, 252, 24, 0.4); display: flex; align-items: center; gap: 5px; }
        
        .nav-btn {
            background: var(--btn-bg); color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        
        .nav-btn.active { background: rgba(83, 252, 24, 0.2); border-color: var(--primary); color: var(--primary); }
        .nav-btn:active { transform: scale(0.95); }
        .refresh-btn { background: #333; }

        /* حاوية المشغل المباشر */
        #player-container { flex: 1; width: 100%; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        
        /* شاشة التحميل */
        #loader {
            position: absolute; inset: 0; background: radial-gradient(circle, #1a2130 0%, #0b0e14 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; transition: opacity 0.5s ease;
        }
        
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(83, 252, 24, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #loader-text { margin-top: 15px; font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="nav-btn refresh-btn" onclick="forceRefresh()">تحديث 🔄</button>
        <button class="nav-btn" onclick="openVod('abuswe7l')">أبو صويلح مسجل</button>
        <button class="nav-btn" onclick="loadStream('abuswe7l', this)">أبو صويلح 🔴</button>
        <button class="nav-btn" onclick="openVod('sxb')">مسجل SXB</button>
        <button class="nav-btn active" onclick="loadStream('sxb', this)">SXB 🔴</button>
        <div class="logo">SXB <span>ULTRA MAX</span></div>
    </div>

    <div id="player-container">
        <div id="loader">
            <div class="spinner"></div>
            <div id="loader-text">جاري إعداد المشغل...</div>
        </div>
        <iframe id="kick-frame" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <script>
        // تفعيل خيارات تليجرام المتقدمة
        try { if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.expand(); Telegram.WebApp.disableVerticalSwipes(); } } catch (e) {}

        const iframe = document.getElementById('kick-frame');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        
        let currentChannel = 'sxb';

        // دالة تشغيل البث المباشر (تعمل داخل الإطار)
        function loadStream(channel, btn) {
            currentChannel = channel;
            
            // إزالة التفعيل فقط عن أزرار المباشر، وتفعيل الزر المضغوط
            document.querySelectorAll('.top-bar .nav-btn:not(.refresh-btn)').forEach(b => {
                if(b.innerText.includes('🔴')) b.classList.remove('active');
            });
            if(btn) btn.classList.add('active');

            loader.classList.remove('hidden');
            loaderText.innerText = `جاري فتح البث المباشر لـ ${channel}...`;
            
            iframe.src = `https://player.kick.com/${channel}?autoplay=true`;

            iframe.onload = () => {
                setTimeout(() => { loader.classList.add('hidden'); }, 800);
            };
            
            setTimeout(() => { loader.classList.add('hidden'); }, 4000);
        }

        // دالة فتح التسجيلات (تعمل عبر متصفح تليجرام الداخلي لتخطي الحظر)
        function openVod(channel) {
            const vodUrl = `https://kick.com/${channel}?videos=true`;
            
            // التحقق من أننا داخل تليجرام لفتح المتصفح المدمج
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                Telegram.WebApp.openLink(vodUrl, { try_instant_view: false });
            } else {
                // للمتصفحات العادية
                window.open(vodUrl, '_blank');
            }
        }

        function forceRefresh() {
            const activeBtn = document.querySelector('.nav-btn.active');
            if(activeBtn) loadStream(currentChannel, activeBtn);
        }

        // تشغيل البث المباشر تلقائياً عند الدخول
        window.onload = () => {
            const defaultBtn = document.querySelector('.nav-btn.active');
            loadStream('sxb', defaultBtn);
        };
    </script>
</body>
</html>
