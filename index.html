<!DO<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SXB RAW MAX</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
    
    <style>
        :root { --primary: #53fc18; --dark: #000; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
        body { background: var(--dark); color: var(--text); height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }
        
        #player-wrapper { position: relative; flex: 1; width: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; outline: none; background: #000; }
        
        #ui-overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,0.9) 100%);
            z-index: 10; transition: opacity 0.4s ease;
        }
        .ui-hidden { opacity: 0; pointer-events: none; }

        .top-bar { display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding: 15px; flex-wrap: wrap; background: rgba(0,0,0,0.5); }
        .logo { font-size: 15px; font-weight: 900; color: var(--primary); margin-left: auto; letter-spacing: 1px; text-shadow: 0 0 10px rgba(83, 252, 24, 0.4); }
        .nav-btn { background: rgba(30,30,30,0.9); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { background: rgba(83,252,24,0.2); border-color: var(--primary); color: var(--primary); }
        
        #center-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; width: 100%; text-align: center; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(83,252,24,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #status-msg { margin-top: 15px; font-size: 14px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); line-height: 1.5; padding: 0 10px; }

        .bottom-bar { padding: 15px; display: flex; flex-direction: column; gap: 15px; background: rgba(0,0,0,0.5); }
        .controls-row { display: flex; align-items: center; justify-content: space-between; position: relative; }
        
        .pill-btn { background: rgba(255,255,255,0.15); padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); }
        
        .center-controls { display: flex; align-items: center; gap: 20px; position: absolute; left: 50%; transform: translateX(-50%); }
        .icon-btn { background: none; border: none; fill: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 28px; height: 28px; }
        .play-btn svg { width: 42px; height: 42px; }

        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: bold; }
        .progress-track { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; cursor: pointer; }
        .progress-filled { position: absolute; left: 0; top: 0; height: 100%; background: var(--primary); border-radius: 2px; width: 0%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="player-wrapper">
        <video id="video-player" playsinline webkit-playsinline muted></video>

        <div id="ui-overlay">
            <div class="top-bar">
                <button class="nav-btn" onclick="fetchStream('abuswe7l', 'vod', this)">أبو صويلح مسجل</button>
                <button class="nav-btn" onclick="fetchStream('abuswe7l', 'live', this)">أبو صويلح 🔴</button>
                <button class="nav-btn" onclick="fetchStream('sxb', 'vod', this)">مسجل SXB</button>
                <button class="nav-btn active" onclick="fetchStream('sxb', 'live', this)">SXB 🔴</button>
                <div class="logo">SXB RAW MAX</div>
            </div>

            <div id="center-loader">
                <div class="spinner" id="spinner"></div>
                <div id="status-msg"></div>
            </div>

            <div class="bottom-bar">
                <div class="controls-row">
                    <div class="pill-btn" onclick="toggleFullScreen()">الشاشة 🔲</div>
                    <div class="center-controls">
                        <button class="icon-btn" onclick="video.currentTime -= 15"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
                        <button class="icon-btn play-btn" onclick="togglePlay()"><svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
                        <button class="icon-btn" onclick="video.currentTime += 15"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
                    </div>
                </div>
                <div class="progress-container">
                    <span id="time-current">00:00</span>
                    <div class="progress-track" id="progress-track" onclick="seek(event)"><div class="progress-filled" id="progress-filled"></div></div>
                    <span id="time-duration">00:00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        try { if (window.Telegram && window.Telegram.WebApp) Telegram.WebApp.expand(); } catch (e) {}

        const video = document.getElementById('video-player');
        const overlay = document.getElementById('ui-overlay');
        const spinner = document.getElementById('spinner');
        const statusMsg = document.getElementById('status-msg');
        const playIcon = document.getElementById('play-icon');
        const progressFilled = document.getElementById('progress-filled');
        const timeCurrent = document.getElementById('time-current');
        const timeDuration = document.getElementById('time-duration');
        
        let hls = null;
        let hideTimer = null;
        let currentMode = 'live';

        function resetTimer() {
            overlay.classList.remove('ui-hidden');
            clearTimeout(hideTimer);
            if (!video.paused) hideTimer = setTimeout(() => overlay.classList.add('ui-hidden'), 3500);
        }
        ['mousemove', 'touchstart', 'click'].forEach(e => overlay.addEventListener(e, resetTimer));
        video.addEventListener('play', resetTimer);
        video.addEventListener('pause', () => { overlay.classList.remove('ui-hidden'); clearTimeout(hideTimer); });

        // محرك البحث المتعدد المسارات (لتفادي الحظر تماماً)
        async function fetchWithBypass(url) {
            const proxies = [
                // المسار الأول: AllOrigins Get (يمنع خطأ Failed to fetch بتمرير البيانات داخل JSON)
                `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                // المسار الثاني: CodeTabs (سيرفر قوي كبديل)
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
                // المسار الثالث: AllOrigins Hexlet (بديل سريع)
                `https://api.allorigins.hexlet.app/get?url=${encodeURIComponent(url)}`
            ];

            let lastErrorMsg = "جميع خوادم التخطي محظورة";

            for (let proxy of proxies) {
                try {
                    statusMsg.innerText = `جاري محاولة اختراق الحماية (${proxies.indexOf(proxy) + 1})...`;
                    const res = await fetch(proxy, { cache: 'no-store' });
                    
                    if (!res.ok) continue;

                    let data;
                    // إذا كان المسار هو AllOrigins، يجب استخراج البيانات من حقل contents
                    if (proxy.includes('allorigins')) {
                        const jsonRes = await res.json();
                        if (jsonRes.contents) {
                            data = JSON.parse(jsonRes.contents);
                        } else {
                            continue;
                        }
                    } else {
                        data = await res.json();
                    }

                    if (data) return data;
                } catch (err) {
                    lastErrorMsg = err.message;
                    continue; // إذا فشل السيرفر، انتقل للذي بعده مباشرة
                }
            }
            throw new Error("فشل تجاوز نظام Cloudflare. جرب مجدداً لاحقاً.");
        }

        async function fetchStream(channel, mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.top-bar .nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if (hls) { hls.destroy(); hls = null; }
            video.pause(); video.removeAttribute('src'); video.load();
            
            spinner.style.display = 'block';
            statusMsg.innerText = 'تهيئة سحب الفيديو...';
            overlay.classList.remove('ui-hidden');

            try {
                const endpoint = mode === 'live' 
                    ? `https://kick.com/api/v2/channels/${channel}` 
                    : `https://kick.com/api/v2/channels/${channel}/videos`;
                
                // استخدام دالة الجلب الذكية الجديدة
                const data = await fetchWithBypass(endpoint);
                let streamUrl = "";

                if (mode === 'live') {
                    if (data.livestream && data.livestream.is_live) streamUrl = data.playback_url;
                    else throw new Error("القناة غير متصلة حالياً 😴 (Offline)");
                } else {
                    if (data.length > 0 && data[0].source) streamUrl = data[0].source;
                    else throw new Error("لا توجد فيديوهات مسجلة لهذه القناة");
                }

                statusMsg.innerText = 'تم التقاط البث بنجاح! جاري التشغيل...';

                if (Hls.isSupported()) {
                    hls = new Hls({ maxBufferLength: 30 });
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, (e, d) => {
                        if (d.levels.length > 0) hls.nextLevel = d.levels.length - 1;
                        playVideo();
                    });
                    hls.on(Hls.Events.ERROR, (e, d) => {
                        if(d.fatal) { spinner.style.display = 'none'; statusMsg.innerText = 'انقطع الاتصال بالسيرفر. اضغط زر التحديث.'; }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                    video.addEventListener('loadedmetadata', playVideo);
                }

            } catch (err) {
                spinner.style.display = 'none';
                statusMsg.innerText = err.message;
            }
        }

        function playVideo() {
            spinner.style.display = 'none';
            statusMsg.innerText = '';
            video.play().catch(() => {
                video.muted = true;
                video.play().catch(() => statusMsg.innerText = 'تم حظر التشغيل التلقائي، اضغط (▶) للبدء');
            });
        }

        function togglePlay() {
            video.muted = false;
            if (video.paused) video.play(); else video.pause();
        }

        video.addEventListener('play', () => playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>');
        video.addEventListener('pause', () => playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>');

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
        }

        video.addEventListener('timeupdate', () => {
            if (currentMode === 'live') {
                timeCurrent.innerText = "مباشر"; timeDuration.innerText = "🔴"; progressFilled.style.width = "100%";
            } else {
                timeCurrent.innerText = formatTime(video.currentTime); timeDuration.innerText = formatTime(video.duration);
                progressFilled.style.width = `${(video.currentTime / video.duration) * 100}%`;
            }
        });

        function seek(e) {
            if (currentMode === 'live') return;
            const rect = document.getElementById('progress-track').getBoundingClientRect();
            video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.();
            else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
        }

        window.onload = () => setTimeout(() => fetchStream('sxb', 'live', document.querySelector('.nav-btn.active')), 300);
    </script>
</body>
</html>
