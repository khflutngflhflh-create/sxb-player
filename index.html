<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SXB ULTRA MAX</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --primary: #53fc18;
            --btn-bg: rgba(30, 30, 30, 0.9);
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { background: #000; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: var(--text-color); height: 100vh; width: 100vw; display: flex; flex-direction: column; }

        /* الشريط العلوي */
        .top-bar { 
            display: flex; align-items: center; justify-content: flex-start; gap: 8px; 
            padding: 12px 15px; flex-wrap: wrap; background: rgba(11, 14, 20, 0.95); 
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 20; 
        }
        
        .logo { font-size: 16px; font-weight: 900; color: var(--primary); letter-spacing: 1px; margin-left: auto; text-shadow: 0 0 10px rgba(83, 252, 24, 0.4); display: flex; align-items: center; gap: 5px; }
        
        .nav-btn {
            background: var(--btn-bg); color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        
        .nav-btn.active { background: rgba(83, 252, 24, 0.2); border-color: var(--primary); color: var(--primary); }
        .nav-btn:active { transform: scale(0.95); }
        .refresh-btn { background: #333; }

        /* حاوية المشغل */
        #player-container { flex: 1; width: 100%; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
        
        /* شاشة التحميل الذكية */
        #loader {
            position: absolute; inset: 0; background: radial-gradient(circle, #1a2130 0%, #0b0e14 100%); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; transition: opacity 0.5s ease;
        }
        
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(83, 252, 24, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #loader-text { margin-top: 15px; font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="nav-btn refresh-btn" onclick="forceRefresh()">تحديث 🔄</button>
        <button class="nav-btn" onclick="loadStream('abuswe7l', this)">أبو صويلح 🎮</button>
        <button class="nav-btn active" onclick="loadStream('sxb', this)">S X B 🚀</button>
        <div class="logo">SXB <span>ULTRA MAX</span></div>
    </div>

    <div id="player-container">
        <div id="loader">
            <div class="spinner"></div>
            <div id="loader-text">جاري فحص حالة القناة...</div>
        </div>
        <iframe id="kick-frame" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <script>
        // إعدادات تليجرام لمنع إغلاق التطبيق بالغلط
        try { if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.expand(); Telegram.WebApp.disableVerticalSwipes(); } } catch (e) {}

        const iframe = document.getElementById('kick-frame');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        
        let currentChannel = 'sxb';

        async function loadStream(channel, btn) {
            currentChannel = channel;
            
            // تحديث الأزرار
            document.querySelectorAll('.top-bar .nav-btn:not(.refresh-btn)').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            // إظهار شاشة التحميل
            loader.classList.remove('hidden');
            loaderText.innerText = `جاري البحث عن بث لـ ${channel}...`;
            
            // إفراغ المشغل القديم لمنع تداخل الصوت
            iframe.src = 'about:blank';

            try {
                // استخدام بروكسي آمن (Hexlet) لفحص حالة القناة هل هي (مباشر) أم (أوفلاين)
                const apiUrl = `https://kick.com/api/v1/channels/${channel}`;
                const proxyUrl = `https://api.allorigins.hexlet.app/raw?url=${encodeURIComponent(apiUrl)}`;
                
                const response = await fetch(proxyUrl, { cache: 'no-store', timeout: 8000 });
                
                if (!response.ok) throw new Error("تعذر جلب البيانات");
                
                const data = await response.json();
                
                // 1. هل القناة تبث مباشر الآن؟
                if (data.livestream && data.livestream.is_live) {
                    loaderText.innerText = 'القناة تبث الآن! جاري التشغيل...';
                    iframe.src = `https://player.kick.com/${channel}?autoplay=true`;
                } 
                // 2. القناة أوفلاين، هل يوجد لها فيديوهات مسجلة سابقة (VOD)؟
                else if (data.previous_livestreams && data.previous_livestreams.length > 0) {
                    loaderText.innerText = 'القناة أوفلاين. جاري تشغيل آخر بث مسجل...';
                    // استخراج معرّف أحدث فيديو مسجل (الفيديو الأول في القائمة)
                    const latestVideoId = data.previous_livestreams[0].video.uuid;
                    iframe.src = `https://player.kick.com/${channel}/video/${latestVideoId}?autoplay=true`;
                } 
                // 3. القناة أوفلاين ولا يوجد لها أي تسجيلات
                else {
                    loaderText.innerText = 'القناة أوفلاين ولا يوجد بث مسجل.';
                    iframe.src = `https://player.kick.com/${channel}?autoplay=true`; // عرض الواجهة الافتراضية الأوفلاين
                }

            } catch (error) {
                console.log(error);
                // إذا فشل الفحص لأي سبب، نعرض المشغل المباشر كحل بديل
                loaderText.innerText = 'يتم فتح المشغل المباشر...';
                iframe.src = `https://player.kick.com/${channel}?autoplay=true`;
            }

            // إخفاء شاشة التحميل بمجرد تحميل إطار Kick الرسمي
            iframe.onload = () => {
                setTimeout(() => { loader.classList.add('hidden'); }, 500);
            };
            
            // كخطة بديلة إذا تأخر التحميل جداً
            setTimeout(() => { loader.classList.add('hidden'); }, 4000);
        }

        // دالة التحديث
        function forceRefresh() {
            const activeBtn = document.querySelector('.nav-btn.active');
            if(activeBtn) loadStream(currentChannel, activeBtn);
        }

        // تشغيل قناة SXB تلقائياً عند الدخول الأول
        window.onload = () => {
            const defaultBtn = document.querySelector('.nav-btn.active');
            loadStream('sxb', defaultBtn);
        };
    </script>
</body>
</html>
